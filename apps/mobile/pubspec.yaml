name: pauti_pustak_mobile
description: Enterprise Multi-tenant Event Financial-Management Platform Flutter Client
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0

  # Networking & Data
  dio: ^5.4.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  intl: ^0.20.2
  collection: ^1.18.0
  equatable: ^2.0.5
  uuid: ^4.3.3

  # Local Storage & Database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.9.0
  path_provider: ^2.1.2
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^7.3.1

  # Firebase Services
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  firebase_crashlytics: ^3.4.19

  # PDF Printing & Utility
  share_plus: ^8.0.2
  printing: ^5.11.1
  cross_file: ^0.3.4+1
  mime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10
  custom_lint: ^0.6.2
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  drift_dev: ^2.16.0
  mocktail: ^1.0.3
  golden_toolkit: ^0.15.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
