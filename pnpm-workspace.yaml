packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  nx: true
  prisma: true
  protobufjs: true
  puppeteer: true
  ssh2: true

onlyBuiltDependencies:
  - '@firebase/util'
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - 'argon2'
  - 'esbuild'
  - 'msgpackr-extract'
  - 'nx'
  - 'prisma'
  - 'protobufjs'
  - 'puppeteer'
