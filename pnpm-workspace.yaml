packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@firebase/util': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  nx: false
  prisma: false
  protobufjs: false
  puppeteer: true
  ssh2: false

onlyBuiltDependencies:
  - '@firebase/util'
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - 'argon2'
  - 'esbuild'
  - 'msgpackr-extract'
  - 'nx'
  - 'prisma'
  - 'protobufjs'
  - 'puppeteer'
