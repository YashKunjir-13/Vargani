name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pauti_user
          POSTGRES_PASSWORD: pauti_pass
          POSTGRES_DB: pauti_pustak_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.16.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma Migration
        env:
          DATABASE_URL: postgresql://pauti_user:pauti_pass@localhost:5432/pauti_pustak_db
        run: pnpm run prisma:generate

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Typecheck & Build
        run: pnpm run build

      - name: Run Unit & Integration Tests
        run: pnpm test:unit
