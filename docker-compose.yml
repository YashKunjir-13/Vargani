name: pauti-pustak

networks:
  pauti_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:

services:
  # ==========================================
  # CORE SERVICES (Profile: core)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: pauti-postgres
    profiles: ["core"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pauti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pauti_password}
      POSTGRES_DB: ${POSTGRES_DB:-pauti_pustak_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pauti_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pauti_user} -d ${POSTGRES_DB:-pauti_pustak_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pauti-redis
    profiles: ["core"]
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pauti_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-02-17T01-15-57Z
    container_name: pauti-minio
    profiles: ["core"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - pauti_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-02-16T15-50-02Z
    container_name: pauti-minio-init
    profiles: ["core"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - pauti_network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb myminio/${S3_BUCKET:-pauti-pustak-assets} --ignore-existing;
      /usr/bin/mc anonymous set download myminio/${S3_BUCKET:-pauti-pustak-assets};
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:v1.15
    container_name: pauti-mailpit
    profiles: ["core"]
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - pauti_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # MESSAGING SERVICES (Profile: messaging)
  # ==========================================
  nats:
    image: nats:2.10-alpine
    container_name: pauti-nats
    profiles: ["messaging"]
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222" # NATS client
      - "8222:8222" # Monitoring
    networks:
      - pauti_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # OBSERVABILITY SERVICES (Profile: observability)
  # ==========================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: pauti-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/observability/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8888:8888" # Metrics
    networks:
      - pauti_network

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: pauti-prometheus
    profiles: ["observability"]
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - pauti_network

  loki:
    image: grafana/loki:2.9.4
    container_name: pauti-loki
    profiles: ["observability"]
    volumes:
      - ./infrastructure/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - pauti_network

  tempo:
    image: grafana/tempo:2.4.0
    container_name: pauti-tempo
    profiles: ["observability"]
    volumes:
      - ./infrastructure/observability/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
    networks:
      - pauti_network

  grafana:
    image: grafana/grafana:10.3.3
    container_name: pauti-grafana
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infrastructure/observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - pauti_network
