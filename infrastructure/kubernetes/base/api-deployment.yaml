apiVersion: apps/v1
kind: Deployment
metadata:
  name: pauti-api
  labels:
    app.kubernetes.io/name: pauti-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pauti-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pauti-api
    spec:
      containers:
        - name: api
          image: pauti-api:latest
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
